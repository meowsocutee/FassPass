<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white">
    <ion-title class="font-bold text-gray-900 text-lg">{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" class="text-gray-600">
        <ion-icon name="close-outline" class="text-2xl"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding bg-gray-50">
  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 min-h-full">
    <div [innerHTML]="contentHtml" class="prose prose-sm max-w-none text-gray-700 leading-relaxed custom-content"></div>
  </div>
</ion-content>
